<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ZAZIMON | 公演情報</title>
</head>
<body>
    <div class="search-container">
        <input type="text" id="keyword" placeholder="検索...">
        <button onclick="checkKeyword()">OK</button>
    </div>
    <div id="result"></div>

    <script>
        function checkKeyword() {
            const val = document.getElementById('keyword').value;
            // ページがあるか確認するための単純なルール
            const pages = {
                "ザジモン": "zazimon-article.html",
                "ザジ山ザジ蔵": "zazizokura-mail.html",
                "うんち": "unchi-news.html",
                "ザジボール": "zaziball-note.html"
            };

            if (pages[val]) {
                window.location.href = pages[val];
            } else {
                document.getElementById('result').innerText = val + " は見つかりません。";
            }
        }
    </script>
</body>
</html>
