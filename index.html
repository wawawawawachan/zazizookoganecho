<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAZIMON | 公式公演情報</title>
    <!-- レトロ風フォントの読み込み -->
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        body { background-color: #333; color: #fff; font-family: 'DotGothic16', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        
        /* 検索窓（上部） */
        .search-container { background: #fff; color: #333; padding: 10px; width: 100%; max-width: 400px; display: flex; justify-content: space-between; border: 4px solid #fff; margin-bottom: 30px; }
        input { border: none; outline: none; width: 70%; font-family: inherit; }
        button { background: #ff0000; color: white; border: none; padding: 5px 10px; cursor: pointer; font-family: inherit; }

        /* 公演情報カード */
        .main-card { background: #fff; color: #333; padding: 20px; width: 100%; max-width: 500px; border: 8px solid #ddd; position: relative; }
        .main-card::before { content: ""; position: absolute; top: -12px; left: -12px; width: 100%; height: 100%; border: 2px solid #555; pointer-events: none; }
        
        h1 { color: #d63031; font-size: 1.2em; border-bottom: 2px solid #d63031; padding-bottom: 10px; }
        .event-info { font-size: 0.9em; margin: 20px 0; }
        .cta { text-align: center; margin-top: 20px; color: #666; font-size: 0.8em; }
    </style>
</head>
<body>

    <div class="search-container">
        <input type="text" id="keyword" placeholder="検索...">
        <button onclick="checkKeyword()">OK</button>
    </div>
    <div id="result" style="margin-bottom: 20px; color: yellow;"></div>

    <div class="main-card">
        <h1>『ザわめきが宇宙の…縮めてザジモン！』</h1>
        <div class="event-info">
            <p><strong>公演日：</strong>9/12-13, 10/11-13</p>
            <p><strong>場所：</strong>黄金町ロックカクほか</p>
            <p>鑑賞者が巨大なオブジェクトと共に歩く、移動型演劇。キミも江戸川乱歩の眼を持とう！</p>
        </div>
        <p><em>「コガネタウンで僕と握手。」</em></p>
    </div>

    <script>
        const links = {
            "ザジモン": "zazimon-article.html",
            "ザジ山ザジ蔵": "zazizokura-mail.html",
            "うんち": "unchi-news.html",
            "ザジボール": "zaziball-note.html"
        };

        function checkKeyword() {
            const val = document.getElementById('keyword').value;
            const res = document.getElementById('result');
            if (links[val]) {
                window.location.href = links[val]; // 直接ページへ遷移
            } else {
                res.innerHTML = "＞ " + val + " はみつからない！";
            }
        }
    </script>
</body>
</html>
