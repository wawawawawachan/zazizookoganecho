<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ザジ・ズー公演情報</title>
    <style>
        body { background: #f4f4f4; color: #333; font-family: 'Helvetica', sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; }
        .search-area { background: #333; padding: 20px; color: white; margin: 20px 0; }
        input { padding: 8px; width: 60%; }
        button { padding: 8px 15px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>『ザわめきが宇宙の…（略）…縮めてザジモン！』</h1>
        <p><strong>公演日程：</strong>9/12-13、10/11-13</p>
        <p><strong>場所：</strong>黄金町ロックカクほか</p>
        <p><em>「コガネタウンで僕と握手。」</em></p>
        
        <nav>
            <a href="#news">NEWS</a> | <a href="#member">出演者</a> | <a href="#schedule">スケジュール</a>
        </nav>

        <div class="search-area">
            <h3>検索：真実の断片を探す</h3>
            <input type="text" id="keyword" placeholder="キーワードを入力...">
            <button onclick="checkKeyword()">検索</button>
            <p id="result"></p>
        </div>
    </div>

    <script>
        function checkKeyword() {
            const val = document.getElementById('keyword').value;
            const res = document.getElementById('result');
            
            // 検索ワードと飛ばし先の管理
            const clues = {
                "ザジモン": "zazimon-hidden.html",
                "コガネタウン": "kogane-info.html"
                // ここにキーワードをどんどん追加していきます
            };

            if (clues[val]) {
                res.innerHTML = `<a href="${clues[val]}" style="color:yellow;">[検索結果] 機密ファイルへのアクセスを確認しました。</a>`;
            } else {
                res.innerHTML = "検索結果なし。";
            }
        }
    </script>
</body>
</html>
