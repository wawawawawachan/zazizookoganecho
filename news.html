<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEWS | ZAZIMON</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--sky:#5BA4CF;--grass:#4CAF50;--grass-dark:#388E3C;--sun:#FFD600;--sun-dark:#F9A825;--red:#E53935;--ink:#1A1A2E;--panel:#F0F8FF;--border:#2C3E50;--pixel:'DotGothic16',monospace;--sans:'Noto Sans JP',sans-serif;}
html{scroll-behavior:smooth;}
body{font-family:var(--sans);background:var(--sky);color:var(--ink);min-height:100vh;overflow-x:hidden;}
.sky-bg{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,#5BA4CF 0%,#7EC8E3 40%,#A8D8EA 58%,#4CAF50 58%,#388E3C 78%,#2E7D32 100%);}
.cloud{position:absolute;background:#fff;opacity:0.9;animation:cloudFloat linear infinite;}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;}
.cloud-1{width:48px;height:16px;top:10%;left:-60px;animation-duration:28s;}
.cloud-1::before{width:32px;height:16px;top:-12px;left:8px;}
.cloud-1::after{width:16px;height:12px;top:-8px;left:24px;}
.cloud-2{width:64px;height:16px;top:20%;left:-80px;animation-duration:36s;animation-delay:-14s;}
.cloud-2::before{width:40px;height:16px;top:-12px;left:12px;}
.cloud-2::after{width:20px;height:12px;top:-8px;left:32px;}
@keyframes cloudFloat{from{left:-100px}to{left:110vw}}
.sun-el{position:absolute;top:6%;right:12%;width:40px;height:40px;background:var(--sun);border-radius:50%;box-shadow:0 0 0 8px var(--sun-dark);animation:sunPulse 3s ease-in-out infinite;}
@keyframes sunPulse{0%,100%{box-shadow:0 0 0 6px var(--sun-dark)}50%{box-shadow:0 0 0 11px var(--sun-dark)}}
.nav{position:sticky;top:0;z-index:200;background:var(--ink);border-bottom:3px solid var(--grass-dark);}
.nav-inner{max-width:560px;margin:0 auto;display:flex;align-items:center;padding:0 12px;}
.nav-logo{font-family:var(--pixel);font-size:14px;color:var(--sun);padding:10px 12px 10px 0;border-right:2px solid #333;margin-right:4px;letter-spacing:0.05em;text-shadow:1px 1px 0 #000;white-space:nowrap;text-decoration:none;}
.nav-links{display:flex;overflow-x:auto;}
.nav-links a{font-family:var(--pixel);font-size:11px;color:#aaa;text-decoration:none;padding:10px 12px;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-3px;transition:color 0.15s,border-color 0.15s;}
.nav-links a:hover{color:#fff;border-bottom-color:var(--grass);}
.nav-links a.active{color:var(--sun);border-bottom-color:var(--sun);}
.wrapper{position:relative;z-index:10;max-width:560px;margin:0 auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:16px;}
.page-label{font-family:var(--pixel);font-size:10px;color:rgba(255,255,255,0.7);letter-spacing:0.3em;}
.page-heading{font-family:var(--pixel);font-size:22px;color:#fff;text-shadow:2px 2px 0 var(--ink);letter-spacing:0.05em;margin-bottom:4px;}

/* ニュースリスト */
.news-board{background:#fff;border:4px solid var(--border);box-shadow:6px 6px 0 var(--border);overflow:hidden;}
.news-board-head{background:var(--border);color:#fff;font-family:var(--pixel);font-size:10px;letter-spacing:0.3em;padding:6px 14px;}
.news-entry{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:2px solid #eee;text-decoration:none;color:var(--ink);transition:background 0.1s;cursor:pointer;}
.news-entry:last-child{border-bottom:none;}
.news-entry:hover{background:#f0f8ff;}
.news-left{flex-shrink:0;text-align:center;min-width:60px;}
.news-date{font-family:var(--pixel);font-size:10px;color:#888;display:block;margin-bottom:4px;}
.news-tag{font-family:var(--pixel);font-size:9px;padding:2px 6px;border-radius:2px;display:inline-block;}
.tag-info{background:var(--sky);color:#fff;}
.tag-warn{background:var(--red);color:#fff;}
.tag-good{background:var(--grass);color:#fff;}
.news-right{flex:1;}
.news-title{font-family:var(--pixel);font-size:13px;line-height:1.6;margin-bottom:4px;}
.news-desc{font-size:11px;color:#666;line-height:1.6;}
.news-arrow{font-size:12px;color:#bbb;margin-left:auto;align-self:center;flex-shrink:0;}

.back-btn{display:block;font-family:var(--pixel);font-size:13px;background:var(--ink);color:var(--sun);border:3px solid var(--ink);padding:12px 20px;text-decoration:none;text-align:center;box-shadow:4px 4px 0 var(--grass-dark);transition:transform 0.1s;}
.back-btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--grass-dark);}
.game-footer{text-align:center;font-family:var(--pixel);font-size:10px;color:rgba(255,255,255,0.6);letter-spacing:0.2em;padding-bottom:20px;}
</style>
</head>
<body>
<div class="sky-bg">
  <div class="sun-el"></div>
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
</div>
<nav class="nav">
  <div class="nav-inner">
    <a class="nav-logo" href="index.html">☆ ZAZIMON</a>
    <div class="nav-links">
      <a href="index.html">TOP</a>
      <a href="news.html" class="active">NEWS</a>
      <a href="about.html">あらすじ</a>
      <a href="ticket.html">チケット</a>
    </div>
  </div>
</nav>
<div class="wrapper">
  <div>
    <div class="page-label">// LATEST INFORMATION</div>
    <div class="page-heading">📰 NEWS</div>
  </div>

  <div class="news-board">
    <div class="news-board-head">▶ ALL NEWS — 新着順</div>

    <a class="news-entry" href="news-date.html">
      <div class="news-left">
        <span class="news-date">2026.06.01</span>
        <span class="news-tag tag-good">情報</span>
      </div>
      <div class="news-right">
        <div class="news-title">公演日時・場所　決定のおしらせ</div>
        <div class="news-desc">9月・10月の公演日程が正式に決定しました。</div>
      </div>

    <a class="news-entry" href="news-start.html">
      <div class="news-left">
        <span class="news-date">2025.12.01</span>
        <span class="news-tag tag-info">開発</span>
      </div>
      <div class="news-right">
        <div class="news-title">ザジモン、開発中！</div>
        <div class="news-desc">開発チームより、プロジェクト再始動のお知らせ。</div>
      </div>
      <div class="news-arrow">▶</div>
    </a>

    <a class="news-entry" href="news-cancel.html">
      <div class="news-left">
        <span class="news-date">2025.09.30</span>
        <span class="news-tag tag-warn">重要</span>
      </div>
      <div class="news-right">
        <div class="news-title">ザジモン開発中止のおしらせ</div>
        <div class="news-desc">諸事情により、開発の一時中止をお知らせします。</div>
      </div>
      <div class="news-arrow">▶</div>
    </a>

  </div>

  <a class="back-btn" href="index.html">← TOPに戻る</a>
  <div class="game-footer">© ZAZIZOO 2026 | 黄金町ARGプロジェクト</div>
</div>
</body>
</html>
